project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!blog.qmd"       # Blog disabled - remove these two lines to re-enable
    - "!posts/**"       # Blog disabled - remove these two lines to re-enable
    - "!teaching/**/*.md"
    - "!teaching/**/*.Rmd"
  resources:
    - "cv/"

website:
  title: "Shaikh Tanvir Hossain"
  description: "Academic personal website"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      # - href: blog.qmd  # Blog disabled - uncomment to re-enable
      #   text: Blog
      - href: cv.qmd
        text: CV

  page-footer:
    left: "© 2025 S. Tanvir Hossain. All rights reserved."
    right: "Built with [Quarto](https://quarto.org/)"

  open-graph: true
  twitter-card: true
  google-analytics: "G-JJNF7NSLWR"

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    css: styles.css
    toc: true
    page-layout: full
    html-math-method: mathjax
    mathjax:
      config:
        tex:
          inlineMath: [['$', '$'], ['\\(', '\\)']]
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        options:
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    number-sections: true
    crossref:
      thm-title: "Theorem"
      lem-title: "Lemma"
      prp-title: "Proposition"
      def-title: "Definition"