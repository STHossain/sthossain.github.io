project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!blog.qmd"       # Blog disabled - remove these two lines to re-enable
    - "!posts/**"       # Blog disabled - remove these two lines to re-enable
    - "!teaching/**/*.md"
    - "!teaching/**/*.Rmd"
  resources:
    - "cv/"

website:
  title: "S. Tanvir Hossain"
  description: "Academic personal website"
  search: false
  page-navigation: true
  reader-mode: false

  navbar:
    title: "S. Tanvir Hossain"
    background: "#4B0000"
    foreground: "#f2f0e8"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      # - href: blog.qmd  # Blog disabled - uncomment to re-enable
      #   text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/STHossain
        target: blank
      - icon: envelope
        href: mailto:tanvir.hossain@tu-dortmund.de

  page-footer:
    background: "#4B0000"
    foreground: "#f2f0e8"
    left: "© 2025 S. Tanvir Hossain"
    center: "Built with [Quarto](https://quarto.org/)"
    right: "[GitHub](https://github.com/STHossain)"

  open-graph: true
  twitter-card: true
  google-analytics: "G-JJNF7NSLWR"

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    css: styles.css
    toc: true
    page-layout: full
    mainfont: "Signika"
    link-external-newwindow: true
    html-math-method: mathjax
    mathjax:
      config:
        tex:
          inlineMath: [['$', '$'], ['\\(', '\\)']]
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        options:
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    number-sections: true
    crossref:
      thm-title: "Theorem"
      lem-title: "Lemma"
      prp-title: "Proposition"
      def-title: "Definition"